name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coco_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coco_ci
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coco_e2e
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      SEED_ADMIN_PASSWORD: ci-only-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
